[workspace]
resolver = "3"
members = [
    "crates/knn-format",
    "crates/knn-check",
    "crates/knn-recall",
    "crates/knn-inspect",
]
# The fuzz crate is its own root: nightly-only, built by cargo-fuzz.
exclude = ["fuzz"]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.99"
authors = ["Ivan Petrouchtchak"]
license = "Apache-2.0"
repository = "https://github.com/userepo/knn-inspect"
publish = false

[workspace.dependencies]
knn-format = { path = "crates/knn-format" }
knn-check = { path = "crates/knn-check" }
knn-recall = { path = "crates/knn-recall" }

# knn-format: the mapping, unaligned little-endian views, the footer CRC.
memmap2 = "0.9.11"
zerocopy = "0.8.63"
crc32fast = "1.5.2"
thiserror = "2.0.21"

# knn-recall: brute force in parallel over queries.
rayon = "1.12.0"

# knn-inspect: the CLI and its output.
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: the tests compare parsed floats with values Faiss
# Python printed; the default fast parser can be a ULP off.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
anyhow = "1.0.104"
# knn-inspect scan: linear-time search for the native vectors in a .vec.
memchr = "2.8.3"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
# Two `syn` majors appear in the dependency list: clap and serde derive
# macros use syn 3, while zerocopy lists zerocopy-derive (syn 2) under a
# target condition that is never true, to keep the two crates' versions
# in step. The lint reads the list, not what is built, so this cannot be
# resolved from here; deny.toml reports duplicates instead.
multiple_crate_versions = "allow"
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Panic hygiene: the parser must never panic on malformed input, so a
# panic site in production code must carry a written justification.
# `unwrap` is banned while `expect` (with its reason string) stays
# allowed; tests keep `unwrap` and indexing via clippy.toml.
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
indexing_slicing = "deny"
exit = "deny"

# `unsafe` is confined to the mmap view module in knn-format; every block
# there carries a SAFETY comment.
undocumented_unsafe_blocks = "deny"
