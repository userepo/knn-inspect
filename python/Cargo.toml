# The Python package's extension module. It is its own Cargo root, outside
# the workspace as fuzz/ is: it links against Python, which the
# workspace's builds and tests need not have. maturin builds it; see
# python/README.md. Its version is the workspace's, kept in step by hand
# and checked by the tests.
[package]
name = "knn-inspect-py"
description = "The Python package's extension module: knn-report's reports for knn_inspect"
version = "0.17.0"
edition = "2024"
rust-version = "1.99"
authors = ["Ivan Petrouchtchak"]
license = "Apache-2.0"
repository = "https://github.com/userepo/knn-inspect"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
# A cdylib that links Python has no test harness worth running; the
# tests are pytest's.
test = false
doctest = false

[dependencies]
knn-check = { path = "../crates/knn-check" }
knn-report = { path = "../crates/knn-report" }
# abi3-py311: one wheel per platform for every CPython from 3.11.
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
serde = "1.0.229"
serde_json = "1.0.154"

[workspace]

# The workspace's lints, copied: a crate outside the workspace cannot
# inherit them.
[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
indexing_slicing = "deny"
exit = "deny"
undocumented_unsafe_blocks = "deny"
