# Every push and pull request: format and lints on Linux (the fuzz target
# included), the test suite on Linux and Windows, and the dependency
# policy. The toolchain comes from rust-toolchain.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The fuzz crate is outside the workspace, so the steps above never
      # build it; running it needs nightly, but compiling it does not.
      - name: Clippy (fuzz target)
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path fuzz/Cargo.toml --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
